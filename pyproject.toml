[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homecheck"
version = "0.1.0"
description = "只读的本机环境体检工具：扫描目录并输出体积报告"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
homecheck = "homecheck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
